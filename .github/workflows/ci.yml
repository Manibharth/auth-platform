name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: lint, types, static security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --dev
      - name: ruff (lint + format)
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy app
      - name: bandit (fail on medium/high)
        run: uv run bandit -c pyproject.toml -r app --severity-level medium
      - name: pip-audit (fail on any known vulnerability)
        run: |
          uv export --no-dev --no-hashes --no-emit-project -o requirements.txt
          uv run pip-audit -r requirements.txt --strict --desc
      - name: OpenAPI contract snapshot
        run: |
          uv run python scripts/export_openapi.py --out openapi/openapi.generated.json
          diff -u openapi/openapi.json openapi/openapi.generated.json \
            || (echo "::error::API changed. Run 'make openapi' and commit openapi/openapi.json" && exit 1)

  test:
    name: tests (real PostgreSQL + Redis), 80% gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: auth
          POSTGRES_DB: auth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auth" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://auth:auth@localhost:5432/auth_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --dev
      - name: Alembic migrations apply on a clean database
        env:
          DATABASE_URL: postgresql+asyncpg://auth:auth@localhost:5432/auth_test
        run: uv run alembic upgrade head && uv run alembic downgrade base
      - name: pytest with coverage gate
        run: >-
          uv run pytest --cov=app --cov-branch --cov-report=xml --cov-report=term
          --cov-fail-under=80 --junitxml=junit.xml
      - name: Schemathesis fuzz (no 5xx, responses match the documented schema)
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://auth:auth@localhost:5432/auth_test
          REDIS_URL: redis://localhost:6379/0
          RATE_LIMIT_ENABLED: "false"
          EMAIL_BACKEND: memory
          SEED_ADMIN_EMAIL: fuzz-admin@example.com
          SEED_ADMIN_PASSWORD: fuzz-admin-passphrase-1
        run: |
          uv run alembic upgrade head
          uv run python -m app.cli generate-key --out /tmp/jwt.pem
          export JWT_PRIVATE_KEY_FILE=/tmp/jwt.pem
          uv run python -m app.cli seed
          uv run uvicorn --factory app.main:create_app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          CHECKS=not_a_server_error,status_code_conformance,content_type_conformance,response_schema_conformance
          uv run schemathesis run http://localhost:8000/openapi.json --checks "$CHECKS" \
            --max-examples 50 --workers 4 --suppress-health-check all
          TOKEN=$(curl -s -X POST localhost:8000/v1/auth/login -H 'content-type: application/json' \
            -d "{\"email\":\"$SEED_ADMIN_EMAIL\",\"password\":\"$SEED_ADMIN_PASSWORD\"}" | jq -r .access_token)
          # authenticated pass; skip operations that would revoke the fuzzing token itself
          uv run schemathesis run http://localhost:8000/openapi.json -H "Authorization: Bearer $TOKEN" \
            --exclude-path-regex '(logout|/users/me$|password/change|/disable|/roles|mfa)' \
            --checks "$CHECKS" --max-examples 50 --workers 4 --suppress-health-check all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: |
            coverage.xml
            junit.xml
      - name: Coverage summary
        if: always()
        run: |
          pct=$(python3 -c "import xml.etree.ElementTree as E;print(round(float(E.parse('coverage.xml').getroot().get('line-rate'))*100,1))")
          echo "### Coverage: ${pct}%" >> "$GITHUB_STEP_SUMMARY"

  image:
    name: docker build + Trivy scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [quality]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: auth-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy (fail on HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: auth-platform:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Container runs as non-root and passes its healthcheck
        run: |
          test "$(docker inspect -f '{{.Config.User}}' auth-platform:ci)" = "10001:10001"
