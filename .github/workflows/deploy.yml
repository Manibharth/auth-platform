name: deploy

on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      image: { type: string, required: true }

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    env:
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: auth-platform-${{ inputs.environment }}
      MIGRATE_JOB: auth-platform-migrate-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Remember the revision currently serving traffic
        id: prev
        run: |
          rev=$(gcloud run services describe "$SERVICE" --region "$REGION" \
                --format='value(status.traffic[0].revisionName)')
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      - name: Run Alembic migrations (separate release step)
        run: |
          gcloud run jobs update "$MIGRATE_JOB" --region "$REGION" --image "${{ inputs.image }}"
          gcloud run jobs execute "$MIGRATE_JOB" --region "$REGION" --wait

      - name: Deploy new revision with no traffic
        run: |
          gcloud run deploy "$SERVICE" --region "$REGION" --image "${{ inputs.image }}" \
            --no-traffic --tag candidate --quiet
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "CANDIDATE_URL=${url/https:\/\//https://candidate---}" >> "$GITHUB_ENV"
          echo "SERVICE_URL=$url" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Smoke test the candidate (readyz, login, one authorised call)
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: uv run --no-project --with httpx python scripts/smoke_test.py "$CANDIDATE_URL"

      - name: Shift all traffic to the new revision
        run: gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest

      - name: Smoke test live traffic
        id: live
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: uv run --no-project --with httpx python scripts/smoke_test.py "$SERVICE_URL"

      - name: Roll back on failure
        if: failure() && steps.prev.outputs.revision != ''
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --to-revisions "${{ steps.prev.outputs.revision }}=100"
          echo "::error::Smoke test failed; traffic rolled back to ${{ steps.prev.outputs.revision }}"
